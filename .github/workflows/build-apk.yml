name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager 를 찾을 수 없습니다"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          "$SDKMANAGER" "platforms;android-35" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Prepare signing keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -storepass infiniteplayer -keypass infiniteplayer \
              -alias infiniteplayer -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Infinite Music Player, OU=App, O=Personal, L=Seoul, C=KR"
            echo "::notice::keystore generated"
          fi

      - name: Upload signing keystore (최초 1회만 필요)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: keystore/release.jks
          if-no-files-found: ignore

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Show result
        run: ls -lh app/build/outputs/apk/release/ app/build/outputs/apk/debug/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: infiniteplayer-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
